name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (formatação)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy .

      - name: pytest
        run: uv run pytest --cov --cov-report=xml

      - name: Upload de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Upload de artefatos
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
