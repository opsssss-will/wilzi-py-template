[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-template"
version = "0.1.0"
description = "Template de projeto Python profissional"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "wilzi" }]
keywords = ["python", "template", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.17.0",
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ipython>=9.0.0",
]

[project.scripts]
python-template = "python_template.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "pytest>=9.0.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_template"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length (deixa pro formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts permitidos em testes

[tool.ruff.lint.isort]
known-first-party = ["python_template"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: testes lentos",
    "integration: testes de integracao",
]

[tool.coverage.run]
source = ["src/python_template"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["python_template"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
